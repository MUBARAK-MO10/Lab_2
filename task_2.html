<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }

        .form-container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            color: #163a63;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 6px;
        }

        .option-group {
            margin-top: 8px;
        }

        .option-group label {
            font-weight: normal;
            margin: 7px 0;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 9px 18px;
            border: 1px solid #555;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div class="form-container">
    <h1>Conference Registration Form</h1>

    <form>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname"
               placeholder="Enter your full name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email address" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age"
               min="18" max="99" placeholder="18" required>

        <label>Gender:</label>
        <div class="option-group">
            <label><input type="radio" name="gender" value="male"> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
        </div>

        <label for="country">Country of Residence:</label>
        <select id="country" name="country">
            <option value="malaysia">Malaysia</option>
            <option value="somalia">Somalia</option>
            <option value="indonesia">Indonesia</option>
            <option value="singapore">Singapore</option>
            <option value="other">Other</option>
        </select>

        <label>Areas of Interest:</label>
        <div class="option-group">
            <label><input type="checkbox" name="interest" value="software"> Software Development</label>
            <label><input type="checkbox" name="interest" value="data"> Data Science</label>
            <label><input type="checkbox" name="interest" value="cybersecurity"> Cybersecurity</label>
            <label><input type="checkbox" name="interest" value="ai"> Artificial Intelligence</label>
        </div>

        <label>Experience Level:</label>
        <div class="option-group">
            <label><input type="radio" name="experience" value="beginner"> Beginner</label>
            <label><input type="radio" name="experience" value="intermediate"> Intermediate</label>
            <label><input type="radio" name="experience" value="advanced"> Advanced</label>
        </div>

        <label for="comments">Comments or Questions:</label>
        <textarea id="comments" name="comments"
                  placeholder="Any comments or questions?"></textarea>

        <div class="buttons">
            <button type="submit">Register</button>
            <button type="reset">Reset</button>
        </div>
    </form>
</div>
</body>
</html>
